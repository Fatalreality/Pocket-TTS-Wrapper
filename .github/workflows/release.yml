name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default is read-only; only the publish job is allowed to write releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build and sign
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned to the commit of dtolnay/rust-toolchain's `stable` branch, with the
      # toolchain named explicitly because a SHA ref cannot carry the branch name.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Node for the Tauri CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm

      # Exact CLI version from package-lock.json; no npm script and no floating tag runs.
      - name: Install the pinned Tauri CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Unsigned on purpose: the updater artifact is signed in its own step below, so
      # no compiler, package manager or other downloaded code ever shares an
      # environment with the signing key.
      - name: Build installer and portable binary
        run: npx --no-install tauri build --config scripts/build-unsigned.json

      # The ONLY step that sees the private key. Nothing but the pinned, already
      # installed Tauri CLI runs here: no npm, no cargo, no build scripts.
      - name: Sign the updater package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem -Path target/release/bundle/nsis -Filter *_x64-setup.exe |
            Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer to sign" }
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          ./node_modules/.bin/tauri.cmd signer sign --app-version $version $installer.FullName

      # Renames the bundles to the hyphenated names the README links to, writes
      # SHA256SUMS.txt and the updater's latest.json.
      - name: Stage release assets
        run: node scripts/release.mjs stage github-release

      - name: Upload staged release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          path: github-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Download staged release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: github-release

      # Creates the release as a draft, uploads and checksums every asset, and only
      # then publishes it, so a failed upload cannot expose a partial release.
      - name: Publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs publish github-release
