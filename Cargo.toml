[package]
name = "pocket-tts-app"
version = "1.0.0"
edition = "2021"
description = "Kyutai Pocket TTS desktop application with Liquid Glass UI"

[[bin]]
name = "pocket-tts-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"

# TTS engine dependencies (same as repo/rust/)
ptts = { path = "vendor/ptts", default-features = false, features = ["hf", "audio"] }
mp3lame-encoder = "0.3"
vorbis_rs = "0.5"
xn = "0.2.11"
half = "2"
hf-hub = { version = "1.0", features = ["blocking"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
rand_distr = "0.5"
reqwest = { version = "0.13", features = ["blocking"] }
safetensors = "0.7"
sentencepiece = { version = "0.14", features = ["static"] }
symphonia = { version = "0.5.3", features = ["all"] }
tempfile = "3"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net"] }
tokio-stream = "0.1"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
